<title>LePhilly Matchup Roast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #151412; --fg: #F2EDE3; --muted: #A8A092; --rule: #F2EDE3; --red: #E4503A; --red-fg: #151412;
  --block-bg: #F2EDE3; --block-fg: #151412; --block-accent: #B32A16; --track: #35322C;
  --display: 'Anton', 'Impact', sans-serif; --label: 'Barlow Condensed', 'Arial Narrow', sans-serif; --body: 'Barlow', system-ui, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F2EDE3; --fg: #121212; --muted: #555048; --rule: #121212; --red: #D2361F; --red-fg: #FFFFFF;
  --block-bg: #121212; --block-fg: #F2EDE3; --block-accent: #FFD84A; --track: #D9D2C3; color-scheme: light;
}
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); }
* { box-sizing: border-box; }
.page { max-width: 1080px; margin: 0 auto; padding: 40px 16px 48px; display: flex; flex-direction: column; gap: 40px; }
.num { font-variant-numeric: tabular-nums; }
.masthead { display: flex; flex-direction: column; gap: 10px; border-bottom: 6px solid var(--rule); padding-bottom: 26px; }
.topline { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; font: 700 clamp(15px, 2.6vw, 26px)/1.1 var(--label); letter-spacing: 3px; text-transform: uppercase; }
.stamp { background: var(--block-bg); color: var(--block-fg); padding: 6px 14px; }
h1 { margin: 8px 0 0; font: 400 clamp(56px, 14vw, 150px)/0.92 var(--display); letter-spacing: -1px; text-transform: uppercase; text-wrap: balance; }
.dek { font: 600 clamp(19px, 2.8vw, 30px)/1.25 var(--label); max-width: 900px; }
h2.sec { margin: 0; font: 700 clamp(15px, 2vw, 20px)/1 var(--label); letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
.section { display: flex; flex-direction: column; gap: 18px; }
.bout { border-top: 4px solid var(--rule); padding-top: 16px; display: flex; flex-direction: column; gap: 14px; }
.bout-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: baseline; font: 700 clamp(15px, 2vw, 20px)/1 var(--label); letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.badge { background: var(--red); color: var(--red-fg); padding: 4px 10px; letter-spacing: 2px; }
.badge.dark { background: var(--block-bg); color: var(--block-accent); }
.side { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; row-gap: 6px; align-items: end; }
.team { font: 800 clamp(26px, 5vw, 44px)/1 var(--label); text-transform: uppercase; overflow-wrap: anywhere; }
.pts { font: 400 clamp(36px, 7vw, 68px)/1 var(--display); text-align: right; }
.side.lose .team, .side.lose .pts { color: var(--muted); }
.tag { font: 700 0.55em/1 var(--label); letter-spacing: 2px; padding: 3px 8px; margin-right: 10px; vertical-align: middle; background: var(--block-bg); color: var(--block-accent); }
.side.lose .tag { background: transparent; border: 2px solid var(--muted); color: var(--muted); }
.track { grid-column: 1 / -1; height: 10px; background: var(--track); }
.track i { display: block; height: 100%; background: var(--fg); }
.side.lose .track i { background: var(--muted); }
.stars { font: 600 clamp(15px, 1.9vw, 19px)/1.3 var(--label); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); grid-column: 1 / -1; }
.stars b { color: var(--fg); font-weight: 700; }
.roast { font-size: clamp(17px, 2.2vw, 21px); line-height: 1.4; max-width: 70ch; margin: 4px 0 0; }
.roast b { font-weight: 600; }
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px; }
.award { padding: 22px 24px; display: flex; flex-direction: column; gap: 6px; border: 4px solid var(--rule); min-width: 0; }
.award.ink { background: var(--block-bg); color: var(--block-fg); border-color: var(--block-bg); }
.award.ink .kicker { color: var(--block-accent); }
.award.red { background: var(--red); color: var(--red-fg); border-color: var(--red); }
.award.red .kicker { color: inherit; }
.kicker { font: 700 clamp(15px, 1.9vw, 20px)/1.1 var(--label); letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
.award .big { font: 400 clamp(28px, 4.6vw, 44px)/1.05 var(--display); text-transform: uppercase; overflow-wrap: anywhere; }
.award p { margin: 0; font-size: clamp(16px, 2vw, 21px); line-height: 1.35; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 560px; }
th { font: 700 clamp(14px, 1.8vw, 20px)/1 var(--label); letter-spacing: 2px; text-transform: uppercase; color: var(--muted); text-align: right; padding: 0 8px 10px; }
th:nth-child(1), th:nth-child(2) { text-align: left; }
td { border-top: 2px solid var(--rule); padding: 12px 8px; text-align: right; font: 700 clamp(20px, 2.6vw, 30px)/1 var(--label); white-space: nowrap; }
td.rk { text-align: left; font: 400 clamp(26px, 3.4vw, 40px)/1 var(--display); width: 56px; }
td.nm { text-align: left; font-weight: 800; text-transform: uppercase; white-space: normal; }
td.nm small { display: block; font: 500 clamp(14px, 1.7vw, 18px)/1.3 var(--body); text-transform: none; color: var(--muted); margin-top: 4px; }
.up { color: var(--fg); } .dn { color: var(--red); }
tr:last-child td { border-bottom: 2px solid var(--rule); }
.live { background: var(--block-bg); color: var(--block-fg); padding: 24px 26px; display: flex; flex-direction: column; gap: 14px; }
.live .kicker { color: var(--block-accent); }
.liverow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: center; border-top: 1px solid color-mix(in srgb, var(--block-fg) 30%, transparent); padding-top: 12px; font: 700 clamp(17px, 2.4vw, 26px)/1.1 var(--label); text-transform: uppercase; }
.liverow .l { text-align: left; } .liverow .r { text-align: right; }
.liverow .mid { font: 400 clamp(18px, 2.6vw, 28px)/1 var(--display); text-align: center; letter-spacing: 0; }
.liverow .lead { color: var(--block-accent); }
.liverow small { display: block; font: 500 14px/1.2 var(--body); text-transform: none; opacity: .75; margin-top: 3px; }
.foot { font-size: 16px; line-height: 1.45; color: var(--muted); border-top: 2px solid var(--rule); padding-top: 14px; }
@page { size: 1080px 1500px; margin: 0; }
@media print {
  html, body { margin: 0; padding: 0; background: var(--bg); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { max-width: none; padding: 48px 56px; }
  .bout, .award, .liverow, tr { break-inside: avoid; }
  .noprint { display: none !important; }
}
@media (max-width: 520px) {
  .liverow { grid-template-columns: 1fr; gap: 4px; }
  .liverow .l, .liverow .r, .liverow .mid { text-align: left; }
}
</style>

<main class="page" id="app"></main>

<script>
const WEEK = {
  league: 'RWB 26–27 · "LePhilly Dreams"',
  weekNo: 4,
  dates: 'Nov 9 – Nov 15',
  edition: 'Final Scores',
  dek: 'Matchup 4 is final and Vishal\'s Spirited Team put up <b>890.00</b>, which is 270.25 below the next-worst team and 492.25 short of DaddyDunco, who barely noticed. Halibarn hung 1,619.25 and went 9-0 in all-play, Edgelord is the only 4-0 team, and Karl-Anthony\'s Clowns scored the third-most points in the league and lost anyway. Everyone else just survived.',
  matchups: [
    { win: { team: 'Halibarn', pts: 1619.25, stars: [['Anthony Davis', 254.25], ['Giannis Antetokounmpo', 217.25]] },
      lose: { team: "Karl-Anthony's Clowns", pts: 1512.75, stars: [['Karl-Anthony Towns', 260.5], ['Devin Booker', 199.75]] },
      badge: 'Clean win', badgeDark: true,
      roast: 'Halibarn put up the top score of the week, <b>1,619.25</b>, and went 9-0 in all-play. Anthony Davis, Giannis and LeBron (<b>93.5</b>) all actually played, which makes the old name Blocked By James a historical document. The Clowns had <b>1,512.75</b>, the third-biggest score in the league, 7-2 in all-play, and still lost, because they were down 161.0 going into Nov 15 and a 273.75 final day only clawed back 54.5 of it. Joel Embiid gave them <b>72.25</b> for the week and Derik Queen <b>47.25</b>. They are 1-3. Josh\'s Finest Team had a better excuse; this one just has a worse record.' },
    { win: { team: 'Edgelord', pts: 1600.75, stars: [['Alperen Sengun', 288.25], ['Cameron Boozer', 191]] },
      lose: { team: 'Wild Metti', pts: 1160.25, stars: [['Pascal Siakam', 214.75], ['Cooper Flagg', 203.75]] },
      badge: 'Demolition', badgeDark: false,
      roast: 'The spreadsheet is now <b>4-0</b>, second-best score of the week at <b>1,600.75</b>, all-play 8-1, and owns the biggest single day in the league (<b>335.0</b> on Nov 13). Sengun alone gave it 288.25. Wild Metti opened Nov 9 with <b>329.5</b>, 28.4% of its entire week in one day, then scraped together 830.75 over the next six, and dropped a <b>65.25</b> on Nov 14. That is a team that scored like a contender on day one and then went home. Metti is 0-4, 1-8 in all-play this week, and has now beaten exactly one team in all-play: the one that scored 890.' },
    { win: { team: '****', pts: 1415.75, stars: [['Victor Wembanyama', 291.25], ['Amen Thompson', 195.5]] },
      lose: { team: 'Neck like Charlie Kirk', pts: 1381.5, stars: [['Jalen Brunson', 217.5], ['Davion Mitchell', 183.75]] },
      badge: 'Nail-biter', badgeDark: true,
      roast: 'Neck led by <b>44.75</b> going into Nov 15, then watched **** drop <b>330.0</b> on the last day while it managed <b>251.0</b>. Lost by <b>34.25</b>. The real crime was Nov 14: <b>50.0</b> against ****\'s 115.0, a 65.0 hole, almost double the final margin. Neck\'s roster also included James Harden at <b>25.25</b> for the week, Jayson Tatum at 167.0 and Jaylen Brown at just 107.0. **** won with Stephen Curry at <b>50.25</b> and Klay Thompson at 27.0, because Wemby (<b>291.25</b>, the best player of the week) carried the whole outfit like a sherpa.' },
    { win: { team: 'Shaqramento Wings', pts: 1472.75, stars: [['Shai Gilgeous-Alexander', 230], ['Kevin Durant', 199.25]] },
      lose: { team: 'Fourth time Cucky', pts: 1258, stars: [['Luka Doncic', 211.75], ['Deni Avdija', 177]] },
      badge: 'Comfortable', badgeDark: false,
      roast: 'Cucky scored 583.5 in two days (<b>283.75</b> on Nov 9, <b>299.75</b> on Nov 11) and then went home. Three of the other five days printed <b>92.25</b>, <b>87.25</b> and <b>91.5</b>, which is the output of a team on a group chat mute. Lost by <b>214.75</b> to a Shaqramento roster that got SGA (230.0) and Durant (199.25) and simply showed up on the other days. Cucky is 2-2 with 2-7 all-play. The fourth time is not a bit anymore, it is a diagnosis. Zion Williamson (137.0) and Brayden Burries (17.0) were on this roster, and I am not sure who thought that was a plan.' },
    { win: { team: 'DaddyDunco', pts: 1382.25, stars: [['Nikola Jokic', 228.75], ['Jamal Murray', 190.75]] },
      lose: { team: "Vishal's Spirited Team", pts: 890, stars: [['Cade Cunningham', 226.25], ['Franz Wagner', 217.25]] },
      badge: 'Massacre', badgeDark: true,
      roast: 'Vishal\'s top two, Cade and Franz, scored <b>443.5</b>, which is more than DaddyDunco\'s top two (<b>419.5</b>), and the team still lost by <b>492.25</b>. The other seven players combined for <b>446.5</b> against DaddyDunco\'s 962.75. Evan Mobley gave <b>35.25</b>, Josh Hart <b>19.5</b>, Precious Achiuwa <b>21.5</b>. The week started with a <b>42.75</b> and ended with a <b>31.5</b>, the lowest single day in the league. Only nine players scored at all. <b>890.00</b> is the lowest score of the week by 270.25. DaddyDunco won with the sixth-best score of ten and a 4-5 all-play, which means it won mostly by showing up.' }
  ],
  awards: [
    { cls: 'ink', kicker: 'Player of the Week', big: 'Victor Wembanyama', text: '291.25 points for ****, 3.0 clear of Alperen Sengun (288.25) and Wemby needed every point of it to drag a 34.25 nail-biter over the line.' },
    { cls: 'red', kicker: 'Blowout', big: 'DaddyDunco over Vishal', text: '492.25 points, 51.75 bigger than Edgelord over Metti (440.5). Vishal\'s Spirited Team lost by more than half of its own score. The Nail-biter was **** over Neck by 34.25.' },
    { cls: '', kicker: 'Hard Luck', big: "Karl-Anthony's Clowns", text: '1,512.75 was the third-highest score of the week, all-play 7-2, and it still lost by 106.5. They are 1-3. At this point it is not luck, it is a pattern the name has not fixed.' },
    { cls: '', kicker: 'Schedule Gods', big: 'DaddyDunco', text: 'All-play 4-5, sixth-best score, and a win by 492.25. Its 1,382.25 beat Neck\'s 1,381.5 by 0.75 in all-play terms, and its one real win came against a team that scored 890.' },
    { cls: '', kicker: 'Biggest Day', big: 'Edgelord', text: '335.0 on Nov 13, 5.0 more than **** on Nov 15 (330.0). Wild Metti (Nov 9) and the Clowns (Nov 13) both hit 329.5. Four teams peaked at 329.5 or higher; two of them lost anyway.' },
    { cls: '', kicker: 'Floor of the Week', big: "Vishal's Spirited Team", text: '890.00, all-play 0-9, the lowest score in the league by 270.25 over Wild Metti (1,160.25). Its final day was 31.5. That is not a floor, that is a basement with a flooded boiler.' }
  ],
  standingsNote: 'Ranked by season points for as ESPN reports them, through the end of matchup 4. Record is ESPN\'s overall record. All-play is this week\'s final scores only: each team against the other nine.',
  standings: [
    { team: 'DaddyDunco', rec: '2-2', pf: 5809.75, ap: '4-5', note: 'First in points, 2-2. Won by 492.25 and was 4-5 against the field. Scoring volume, not scoring quality' },
    { team: '****', rec: '3-1', pf: 5598, ap: '5-4', note: 'Down 44.75 into the last day and won anyway. Wemby is the whole franchise' },
    { team: 'Neck like Charlie Kirk', rec: '2-2', pf: 5580.25, ap: '3-6', note: 'Lost by 34.25 after leading into the final day. 1.50 points ahead of Edgelord in total' },
    { team: 'Edgelord', rec: '4-0', pf: 5578.75, ap: '8-1', note: 'Only 4-0, fourth in points. The spreadsheet is running things' },
    { team: 'Halibarn', rec: '3-1', pf: 5279, ap: '9-0', note: 'Best score of the week. Giannis, AD and LeBron all showed up. Suspicious' },
    { team: 'Fourth time Cucky', rec: '2-2', pf: 5257.75, ap: '2-7', note: 'Two big days, three days under 93. Cucky on schedule' },
    { team: "Karl-Anthony's Clowns", rec: '1-3', pf: 5163.75, ap: '7-2', note: '1,512.75 and a loss. All-play 7-2 and a 1-3 record. Names do not fix this' },
    { team: 'Shaqramento Wings', rec: '2-2', pf: 5066.75, ap: '6-3', note: 'SGA 230.0, fourth-best score, a win by 214.75. Eighth in points anyway' },
    { team: 'Wild Metti', rec: '0-4', pf: 4371.5, ap: '1-8', note: '0-4. Opened Nov 9 with 329.5 and then went home' },
    { team: "Vishal's Spirited Team", rec: '1-3', pf: 4157.75, ap: '0-9', note: 'Last in points at 4,157.75. 890.00 this week with a 31.5 last day' }
  ],
  footnote: 'Scores are ESPN\'s final totals for matchup period 4 (scoring days Nov 9 to Nov 15); all five games show a decided winner. Player totals are full-week fantasy points from the box score. <span class="noprint"><a href="#" id="pdfdl" style="color:var(--fg)">Download the Week 4 PDF</a>.</span>'
};

/* ============ renderer ============ */
const f = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function bout(m, i) {
  const max = Math.max(m.win.pts, m.lose.pts);
  const margin = m.win.pts - m.lose.pts;
  const stars = s => s.stars.map(x => `<b>${x[0]}</b> ${f(x[1])}`).join(' &nbsp;·&nbsp; ');
  const side = (s, cls, tag) => `
    <div class="side ${cls}">
      <div class="team"><span class="tag">${tag}</span>${s.team}</div>
      <div class="pts num">${f(s.pts)}</div>
      <div class="track"><i style="width:${(s.pts / max * 100).toFixed(1)}%"></i></div>
      <div class="stars">${stars(s)}</div>
    </div>`;
  return `
  <article class="bout">
    <div class="bout-head"><span>Matchup ${i + 1} · Won by <span class="num">${f(margin)}</span></span><span class="badge ${m.badgeDark ? 'dark' : ''}">${m.badge}</span></div>
    ${side(m.win, 'win', 'W')}
    ${side(m.lose, 'lose', 'L')}
    <p class="roast">${m.roast}</p>
  </article>`;
}
function render(w) {
  const rows = w.standings.map((s, i) => `
    <tr><td class="rk">${i + 1}</td>
    <td class="nm">${s.team}<small>${s.note}</small></td>
    <td class="num">${s.rec}</td><td class="num">${f(s.pf)}</td><td class="num">${s.ap}</td></tr>`).join('');
  document.getElementById('app').innerHTML = `
  <header class="masthead">
    <div class="topline"><span>${w.league}</span><span class="stamp">Week ${w.weekNo} · ${w.dates}</span></div>
    <h1>Matchup<br>Roast</h1>
    <div class="dek">${w.dek}</div>
  </header>
  <section class="section"><h2 class="sec">The Scoreboard · ${w.edition}</h2>${w.matchups.map(bout).join('')}</section>
  <section class="section"><h2 class="sec">The Hardware</h2>
    <div class="awards">${w.awards.map(a => `<div class="award ${a.cls}"><span class="kicker">${a.kicker}</span><span class="big">${a.big}</span><p>${a.text}</p></div>`).join('')}</div></section>
  <section class="section"><h2 class="sec">Power Rankings</h2>
    <div class="tablewrap"><table><thead><tr><th>#</th><th>Team</th><th>Record</th><th>Points</th><th>All-play</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="foot" style="border:0;padding:0">${w.standingsNote}</p></section>
  <div class="foot">${w.footnote}</div>`;
}
render(WEEK);
(async () => {
  const a = document.getElementById('pdfdl');
  if (!a) return;
  const url = '/_blob/30ef201671925428798b2120e197a6d9';
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  let dl = null;
  try { dl = await claude.use('downloads'); } catch (err) {}
  if (!dl) return;
  a.addEventListener('click', async e => {
    e.preventDefault();
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error('fetch ' + r.status);
      const blob = await r.blob();
      await dl.save({ filename: 'matchup-roast-week4.pdf', data: blob });
    } catch (err) {
      if (err && err.code === 'declined') return;
      window.open(url, '_blank');
    }
  });
})();
</script>
